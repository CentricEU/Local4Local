<div class="main-info-container">
	<div class="section-info-container">
		<div class="info-content">
			@for(section of sections; track section){
			<div class="text">
				<p class="title bold" [ngClass]="section.class">{{ section.title | translate }}</p>
				@if(section.text) {
				<p [innerHTML]="section.text | translate"></p>
				}
			</div>
			}
		</div>
		<img src="../../../../assets/images/section-info.svg" alt="Description image en" />
	</div>
</div>
